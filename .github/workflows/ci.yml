name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Backend tests
        run: python -m pytest -q
      - name: Frontend checks
        run: npm run test:frontend
      - name: Install browser for UI smoke test
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          python -m http.server 8765 --directory docs >/tmp/chip-site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          python tests/visual_smoke.py
