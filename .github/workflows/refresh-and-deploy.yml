name: Refresh data and deploy Pages

on:
  schedule:
    # 10:00 UTC = 18:00 Asia/Taipei (Taiwan has no daylight saving time).
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test before refresh
        run: |
          python -m pytest -q
          npm run test:frontend
      - name: Refresh verified market data
        run: python -m chip_tracker.cli --root . run --dashboard-path docs/data/dashboard.json
      - name: Verify generated site
        run: npm run test:frontend
      - name: Install browser for release smoke test
        run: python -m playwright install --with-deps chromium
      - name: Release browser smoke test
        run: |
          python -m http.server 8765 --directory docs >/tmp/chip-site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          python tests/visual_smoke.py
      - name: Commit verified data and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs reports
          git diff --cached --quiet || git commit -m "data: refresh verified chip report"
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
