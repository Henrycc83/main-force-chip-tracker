[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "main-force-chip-tracker"
version = "0.1.0"
description = "Auditable Taiwan main-force chip tracking pipeline"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-cov>=6.0", "playwright>=1.52"]

[project.scripts]
chip-tracker = "chip_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
